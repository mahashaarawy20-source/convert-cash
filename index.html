        :root {

            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #cbd5e1;
            --input-bg: #f1f5f9;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --danger-color: #dc2626;
            --success-color: #16a34a;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-speed: 0.3s;
        }

        /* --------------------------------------------------------------------------
           الوضع الليلي (Dark Theme Styles)
           -------------------------------------------------------------------------- */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --input-bg: #0f172a;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        /* ==========================================================================
           2. إعادة الضبط العامة والتنسيقات الأساسية
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color var(--transition-speed) ease, 
                        color var(--transition-speed) ease, 
                        border-color var(--transition-speed) ease, 
                        box-shadow var(--transition-speed) ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ==========================================================================
           3. الحاويات الهيكلية وعناصر الواجهة (Layout Components)
           ========================================================================== */
        .app-container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .app-header h1 {
            font-size: 1.85rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .theme-btn:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        /* ==========================================================================
           4. البطاقة الرئيسية للتطبيق ومكونات النماذج
           ========================================================================== */
        .converter-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: var(--radius-md);
            font-size: 1.15rem;
            font-weight: 600;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* ==========================================================================
           5. قسم تفاعل العملات والقوائم المنسدلة المخصصة
           ========================================================================== */
        .currencies-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            margin-bottom: 28px;
        }

        @media (max-width: 550px) {
            .currencies-section {
                grid-template-columns: 1fr;
            }
            .swap-btn {
                margin: 0 auto;
                transform: rotate(90deg);
            }
        }

        .currency-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
        }

        .select-trigger {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 13px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .select-trigger:hover {
            border-color: var(--primary-color);
        }

        .select-trigger .arrow {
            margin-right: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            left: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
            max-height: 300px;
            flex-direction: column;
            overflow: hidden;
        }

        .dropdown-menu.open {
            display: flex;
        }

        .search-input {
            padding: 12px 14px;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .options-list {
            overflow-y: auto;
            max-height: 230px;
        }

        .option-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .option-item:hover {
            background-color: var(--input-bg);
            color: var(--primary-color);
        }

        .swap-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: var(--text-color);
            margin-top: 22px;
        }

        .swap-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            transform: rotate(180deg);
        }

        /* ==========================================================================
           6. حاويات النتائج، أشرطة التحميل، والرسائل
           ========================================================================== */
        .results-section {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 24px;
            text-align: center;
        }

        #original-text {
            font-size: 1rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        #converted-result {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 18px;
            letter-spacing: -1px;
        }

        .info-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 18px;
        }

        .info-card .info-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .info-card .info-value {
            font-size: 0.95rem;
            font-weight: 700;
        }

        /* ==========================================================================
           7. لوحة أزرار التفاعل والإجراءات السريعة
           ========================================================================== */
        .actions-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .action-btn.secondary {
            background-color: var(--primary-color);
            color: #fff;
        }

        .action-btn.secondary:hover {
            background-color: var(--primary-hover);
        }

        .action-btn.danger {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .action-btn.danger:hover {
            background-color: rgba(220, 38, 38, 0.1);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
    </style>
</head>

        ];

        document.addEventListener("DOMContentLoaded", function () {
            const amountInput = document.getElementById("amount");
            const fromTrigger = document.getElementById("from-trigger");
            const toTrigger = document.getElementById("to-trigger");
            const fromDropdown = document.getElementById("from-dropdown");
            const toDropdown = document.getElementById("to-dropdown");
            const fromOptions = document.getElementById("from-options");
            const toOptions = document.getElementById("to-options");
            const fromSearch = document.getElementById("from-search");
            const toSearch = document.getElementById("to-search");
            const swapBtn = document.getElementById("swap-btn");
            const copyBtn = document.getElementById("copy-btn");
            const clearBtn = document.getElementById("clear-btn");
            const themeToggle = document.getElementById("theme-toggle");
            
            const convertedResult = document.getElementById("converted-result");
            const originalText = document.getElementById("original-text");
            const exchangeRateText = document.getElementById("exchange-rate-text");

            const fromSelectedFlag = document.getElementById("from-selected-flag");
            const fromSelectedText = document.getElementById("from-selected-text");
            const toSelectedFlag = document.getElementById("to-selected-flag");
            const toSelectedText = document.getElementById("to-selected-text");

            let appState = {
                amount: 1,
                fromCurrency: "EGP",
                toCurrency: "USD",
                theme: "light"
            };

            function restoreSessionStorage() {
                const savedData = localStorage.getItem("offlineCurrencyState");
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        if (parsed.fromCurrency) appState.fromCurrency = parsed.fromCurrency;
                        if (parsed.toCurrency) appState.toCurrency = parsed.toCurrency;
                        if (parsed.amount !== undefined) appState.amount = parsed.amount;
                        if (parsed.theme) appState.theme = parsed.theme;
                    } catch (e) {
                        console.error(e);
                    }
                }
                amountInput.value = appState.amount;
                document.documentElement.setAttribute("data-theme", appState.theme);
                themeToggle.textContent = appState.theme === "dark" ? "☀️" : "🌙";
            }

            function persistSessionStorage() {
                localStorage.setItem("offlineCurrencyState", JSON.stringify(appState));
            }

            function renderCurrencyOptions(searchFilter = "") {
                const query = searchFilter.toLowerCase().trim();
                const matched = currenciesData.filter(c => 
                    c.code.toLowerCase().includes(query) ||
                    c.nameAr.toLowerCase().includes(query) ||
                    c.countryAr.toLowerCase().includes(query)
                );

                const html = matched.map(c => `
                    <div class="option-item" data-code="${c.code}">
                        <span>${c.flag}</span>
                        <span><strong>${c.code}</strong> (${c.countryAr}) — ${c.nameAr}</span>
                    </div>
                `).join("");

                fromOptions.innerHTML = html;
                toOptions.innerHTML = html;
            }

            function refreshSelectedUI() {
                const fromObj = currenciesData.find(c => c.code === appState.fromCurrency);
                const toObj = currenciesData.find(c => c.code === appState.toCurrency);

                if (fromObj) {
                    fromSelectedFlag.textContent = fromObj.flag;
                    fromSelectedText.textContent = `${fromObj.code} - ${fromObj.nameAr}`;
                }
                if (toObj) {
                    toSelectedFlag.textContent = toObj.flag;
                    toSelectedText.textContent = `${toObj.code} - ${toObj.nameAr}`;
                }
            }

            function executeConversionMath() {
                const rateFromUSD = localExchangeRatesData[appState.fromCurrency] || 1.0;
                const rateToUSD = localExchangeRatesData[appState.toCurrency] || 1.0;
                
                const directRate = rateToUSD / rateFromUSD;
                const finalResult = appState.amount * directRate;
                const fromObj = currenciesData.find(c => c.code === appState.fromCurrency);

                originalText.textContent = `${Number(appState.amount).toLocaleString()} ${fromObj ? fromObj.nameAr : appState.fromCurrency} =`;
                
                // تثبيت الكسور بدقة رقمين عشريين בדיוק (2 Decimal Places)
                convertedResult.textContent = finalResult.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                exchangeRateText.textContent = `1 ${appState.fromCurrency} = ${Number(directRate.toFixed(2))} ${appState.toCurrency}`;
            }

            fromTrigger.addEventListener("click", () => {
                fromDropdown.classList.toggle("open");
                toDropdown.classList.remove("open");
                fromSearch.focus();
            });

            toTrigger.addEventListener("click", () => {
                toDropdown.classList.toggle("open");
                fromDropdown.classList.remove("open");
                toSearch.focus();
            });

            window.addEventListener("click", (e) => {
                if (!e.target.closest(".currency-box")) {
                    fromDropdown.classList.remove("open");
                    toDropdown.classList.remove("open");
                }
            });

            fromSearch.addEventListener("input", (e) => renderCurrencyOptions(e.target.value));
            toSearch.addEventListener("input", (e) => renderCurrencyOptions(e.target.value));

            fromOptions.addEventListener("click", (e) => {
                const item = e.target.closest(".option-item");
                if (item) {
                    appState.fromCurrency = item.getAttribute("data-code");
                    fromDropdown.classList.remove("open");
                    refreshSelectedUI();
                    persistSessionStorage();
                    executeConversionMath();
                }
            });

            toOptions.addEventListener("click", (e) => {
                const item = e.target.closest(".option-item");
                if (item) {
                    appState.toCurrency = item.getAttribute("data-code");
                    toDropdown.classList.remove("open");
                    refreshSelectedUI();
                    persistSessionStorage();
                    executeConversionMath();
                }
            });

            amountInput.addEventListener("input", (e) => {
                let val = e.target.value.replace(/,/g, '.').replace(/[^0-9.]/g, '');
                const parts = val.split('.');
                if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
                
                amountInput.value = val;
                appState.amount = val === "" || val === "." ? 0 : Number(val);
                persistSessionStorage();
                executeConversionMath();
            });

            swapBtn.addEventListener("click", () => {
                const temp = appState.fromCurrency;
                appState.fromCurrency = appState.toCurrency;
                appState.toCurrency = temp;
                refreshSelectedUI();
                persistSessionStorage();
                executeConversionMath();
            });

            copyBtn.addEventListener("click", () => {
                const text = `${originalText.textContent} ${convertedResult.textContent}`;
                navigator.clipboard.writeText(text).then(() => {
                    const old = copyBtn.textContent;
                    copyBtn.textContent = "تم النسخ بنجاح!";
                    setTimeout(() => copyBtn.textContent = old, 1500);
                });
            });

            clearBtn.addEventListener("click", () => {
                appState.amount = 1;
                amountInput.value = 1;
                persistSessionStorage();
                executeConversionMath();
            });

            themeToggle.addEventListener("click", () => {
                appState.theme = appState.theme === "light" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", appState.theme);
                themeToggle.textContent = appState.theme === "dark" ? "☀️" : "🌙";
                persistSessionStorage();
            });

            restoreSessionStorage();
            renderCurrencyOptions();
            refreshSelectedUI();
            executeConversionMath();
        });
    </script>
